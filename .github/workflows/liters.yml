name: Literklassement bijwerken

on:
  schedule:
    # Reservekopie van het literklassement (de site leest de spreadsheet ook live).
    # Elke dag 20:00 UTC = 21:00 NL-wintertijd
    - cron: "0 20 * * *"
  workflow_dispatch: {}
  # Ook draaien als het script of deze workflow wordt aangepast
  push:
    branches: [main]
    paths: ["scripts/update-liters.mjs", "scripts/parse.mjs", ".github/workflows/liters.yml"]

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-liters.mjs
        env:
          LITERS_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyZ0BNstIFRzEszqjoN0j_hG2q6AaZZ43tpw6OtztChcx_FJz7OZGUm1jxlYvOwKu9zEjN12Cb03h5/pub?gid=224456486&single=true&output=csv"
      - name: Wijzigingen opslaan
        run: |
          git config user.name "kamelen-bot"
          git config user.email "kamelen-bot@users.noreply.github.com"
          git add liters.json
          git diff --staged --quiet || (git commit -m "Literklassement bijgewerkt" && git pull --rebase && git push)
