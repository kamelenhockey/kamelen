name: Competitie bijwerken

on:
  schedule:
    # Tijden in UTC (Nederland = UTC+1 in de winter, UTC+2 in de zomer).
    # Za en zo (wedstrijddagen): elk half uur van ca. 09:00 tot 00:00 NL-tijd
    - cron: "15,45 8-22 * * 0,6"
    # Overige dagen (inhaalwedstrijden, programmawijzigingen): elk uur van ca. 08:00 tot 00:00 NL-tijd
    - cron: "15 7-22 * * 1-5"
  workflow_dispatch: {}
  # Ook draaien als het script of deze workflow wordt aangepast
  push:
    branches: [main]
    paths: ["scripts/update-competitie.mjs", "scripts/parse.mjs", ".github/workflows/competitie.yml"]

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/update-competitie.mjs
      - name: Wijzigingen opslaan
        if: always()
        run: |
          git config user.name "kamelen-bot"
          git config user.email "kamelen-bot@users.noreply.github.com"
          git add competitie.json kamelen.ics
          [ -d debug ] && git add -f debug || true
          git diff --staged --quiet || (git commit -m "Competitie bijgewerkt" && git pull --rebase && git push)
